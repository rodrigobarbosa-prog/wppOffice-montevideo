<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WPP · Visual review</title><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script><style>*{box-sizing:border-box}body{margin:0;background:#172528;color:#fff;font:14px system-ui}canvas{display:block}nav{position:fixed;top:18px;left:18px;right:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{background:#143d39e8;color:white;border:1px solid #b5d9ca66;border-radius:8px;padding:12px;cursor:pointer}p{position:fixed;bottom:12px;left:20px;background:#16322ed9;padding:12px 18px;border-radius:8px;max-width:90vw}button:disabled{opacity:.5}strong{margin-right:auto;text-shadow:0 1px 4px #000}</style></head><body><canvas id="view" aria-label="Visual review of the office"></canvas><nav><strong>WPP Production · Visual review</strong><button id="room" disabled>Meeting room screen</button><button id="lift" disabled>Mirrored elevator</button><button id="client" disabled>Original client</button><button id="walk" disabled>Presenter walking</button><button id="attention" disabled>Call attention</button></nav><p id="state">Loading the office and people… No audio or microphone.</p><script type="module">
import * as T from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {buildRouteWorld} from '/src/route-world.js';import {createClientAvatar} from '/src/client-avatar.js';import {createPresenterAvatar} from '/src/presenter-avatar.js';import {officeShiftZ} from '/src/office-layout.js';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#bec9c7');const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.05,1000),pmrem=new T.PMREMGenerator(renderer),roomEnvironment=new RoomEnvironment();scene.environment=pmrem.fromScene(roomEnvironment,.04).texture;scene.environmentIntensity=.65;
const world=await buildRouteWorld(scene),[client,presenter]=await Promise.all([createClientAvatar(scene),createPresenterAvatar(scene)]);
const backdrop=new T.Mesh(new T.PlaneGeometry(12,7),new T.MeshStandardMaterial({color:'#52676b',roughness:1}));backdrop.position.set(41,2,-1.5);scene.add(backdrop);
const floor=new T.Mesh(new T.PlaneGeometry(12,12),new T.MeshStandardMaterial({color:'#c7ceca',roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.set(41,-.005,0);floor.receiveShadow=true;scene.add(floor);const light=new T.DirectionalLight('#fff3df',3);light.position.set(39,5,4);light.castShadow=true;scene.add(light);scene.add(new T.HemisphereLight('#eaf3f3','#879185',1));
let mode='room';const state=document.querySelector('#state');
function show(next){mode=next;client.visible=next==='client'||next==='attention';presenter.visible=next==='walk'||next==='attention';client.position.set(40,0,0);client.userData.face(0);presenter.position.set(42,0,0);presenter.userData.face(0);camera.fov=55;
 if(next==='room'){camera.position.set(10.3,1.68,-6.55+officeShiftZ);camera.lookAt(12.3,1.65,-8.2+officeShiftZ);state.textContent='MEET POINT 01 · Large wall-mounted display beside the cabinet';}
 if(next==='lift'){camera.position.set(-.30,1.60,3.05);camera.lookAt(.30,1.45,4.68);state.textContent='C14 · Real mirrors, warm lighting, stone floor and stainless-steel handrails';}
 if(next==='client'){camera.position.set(40.65,1.24,3.15);camera.lookAt(40,1.05,0);camera.fov=40;state.textContent='Client · Original Passive Marker Man restored · Unmodified geometry and textures';}
 if(next==='attention'){camera.position.set(41,1.55,5.4);camera.lookAt(41,1,0);camera.fov=38;state.textContent='Attention request · Raise a hand and wave · Visible to all participants';client.userData.actionUntil=presenter.userData.actionUntil=performance.now()+3200;}
 if(next==='walk'){camera.position.set(43.8,1.3,3.8);camera.lookAt(42,1,0);camera.fov=36;state.textContent='Presenter · Continuous walk cycle at 1.2 m/s, with the same rig used in the tour';}
 camera.updateProjectionMatrix();document.body.dataset.mode=next;
}
for(const id of ['room','lift','client','walk','attention']){document.getElementById(id).disabled=false;document.getElementById(id).onclick=()=>show(id);}show(new URL(location.href).searchParams.get('mode')==='attention'?'attention':'room');let previous=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(.06,(now-previous)/1000);previous=now;client.userData.animate(dt);presenter.userData.animate(dt,{speed:mode==='walk'?1.2:0});renderer.render(scene,camera);});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
