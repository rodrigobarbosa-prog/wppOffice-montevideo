<!doctype html><html><meta charset="utf-8"><title>Avatar gesture QA</title><style>body{font:15px system-ui;background:#f0f5f4;color:#123d33}button,select{padding:12px}canvas{display:block;max-height:75vh}</style><h1>Gestos · revisión ligera</h1><p>Un personaje, texturas móviles, sin oficina ni bucle de render.</p><select id="role"><option value="presenter">Presentador</option><option value="client">Cliente</option><option value="collaborator">Brian</option></select><button id="thumbsUp">Thumbs up</button><button id="point">Point</button><button id="no">No</button><button id="idle">Rest</button><p id="state">Loading</p><canvas id="view"></canvas><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script><script type="module">
import * as T from 'three';import{GLTFLoader}from'/vendor/addons/loaders/GLTFLoader.js';import{buildMixamoPresenter}from'/src/mixamo-presenter.js';
const renderer=new T.WebGLRenderer({canvas:document.getElementById('view'),antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(1);renderer.setSize(560,650);renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.background=new T.Color('#cddbd9');scene.add(new T.HemisphereLight(0xffffff,0x58706b,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(2,3,4);scene.add(light);const camera=new T.PerspectiveCamera(35,560/650,.1,20);camera.position.set(0,1.15,3.7);camera.lookAt(0,1,0);let root;
function draw(kind){if(!root)return;root.userData.socialGesture=kind==='idle'?null:{kind,point:{x:1,y:1.6,z:4},started:performance.now()-1000};root.userData.animate(.01);renderer.render(scene,camera);document.getElementById('state').textContent=document.getElementById('role').value+' · '+kind;}
const close=document.createElement('button');close.textContent='Hand close-up';document.getElementById('idle').after(close);close.onclick=()=>{camera.position.set(-.5,1.65,1.15);camera.lookAt(-.4,1.5,0);draw('thumbsUp');};
async function load(){if(root){scene.remove(root);root.traverse(o=>{o.geometry?.dispose();for(const m of [o.material].flat().filter(Boolean)){m.map?.dispose();m.normalMap?.dispose();m.dispose();}});}const role=document.getElementById('role').value,folder=role==='presenter'?'mixamo':role==='client'?'client':'collaborator';const gltf=await new GLTFLoader().loadAsync('/assets/avatars/'+folder+'/'+role+'-mobile.glb');root=buildMixamoPresenter(scene,gltf,{client:role==='client'});draw('idle');}
for(const kind of ['thumbsUp','point','no','idle'])document.getElementById(kind).onclick=()=>draw(kind);document.getElementById('role').onchange=load;load().catch(e=>document.getElementById('state').textContent=e.message);
</script></html>
