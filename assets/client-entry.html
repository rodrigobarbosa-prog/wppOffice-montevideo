<!doctype html>
<html lang="en">
<head>
 <base href="/">
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#f6f4fa">
 <title>Your Visit · WPP Production Montevideo</title>
 <link rel="stylesheet" href="assets/lobby.css">
</head>
<body class="client-entry">
<main class="client-shell">
 <header class="site-header">
  <strong class="wordmark">WPP <span>Production</span></strong>
  <span class="location">Montevideo, Uruguay <span>Floor 14</span></span>
 </header>
 <section class="client-welcome" aria-labelledby="invitation-title">
  <div class="brand-art client-art" aria-hidden="true">
   <i></i><i></i><i></i>
   <div class="invitation-mark"><img src="assets/wpp-dotted-mark.png" width="1040" height="296" alt=""><span>Production</span></div>
  </div>
  <div class="client-card">
   <p class="eyebrow">Your invitation</p>
   <h1 id="invitation-title">See you<br>at the office.</h1>
   <p class="client-description">Tour our Montevideo office and meet the team working on your project.</p>
   <form id="client-entry-form">
    <label for="guest-name">Your name <span>optional</span></label>
    <input id="guest-name" maxlength="40" autocomplete="given-name" placeholder="Enter your name">
    <button class="primary" id="client-enter" type="submit" disabled>Preparing your visit…</button>
   </form>
   <p id="client-entry-status" class="client-entry-status" role="status">Connecting to your visit…</p>
   <p class="client-privacy">Your microphone is off when you join. You can turn it on during the visit.</p>
  </div>
 </section>
</main>
<script type="module" src="src/client-entry.js"></script>
</body>
</html>
